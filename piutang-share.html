<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Piutang (AR) MKI Makassar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1209;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;}
#status{color:#fff;font-size:15px;text-align:center;opacity:.8;}
#spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.2);border-top-color:#c17a5a;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
canvas{display:none;border-radius:12px;max-width:100%;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.btn-group{display:none;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:360px;}
#btnWA{background:#25D366;color:#fff;border:none;border-radius:12px;padding:16px 0;font-size:18px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;}
#btnSave{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:12px 0;font-size:14px;cursor:pointer;width:100%;}
#note{color:rgba(255,255,255,.45);font-size:12px;text-align:center;max-width:320px;line-height:1.6;display:none;}
#errMsg{display:none;color:#ff6b6b;font-size:14px;text-align:center;max-width:320px;}
</style>
</head>
<body>
<div id="spinner"></div>
<div id="status">Mengambil data terkini&hellip;</div>
<canvas id="cv" width="1080" height="600"></canvas>
<div class="btn-group" id="btnGroup">
<button id="btnWA">📲 Kirim ke WhatsApp</button>
<button id="btnSave">Simpan ke Galeri</button>
<a id="linkFull" href="#" target="_blank" style="display:none;color:#f0c9a8;font-size:13px;text-decoration:underline;text-align:center;">📄 Buka data lengkap (semua faktur)</a>
</div>
<div id="note"></div>
<div id="errMsg"></div>
<script>
const SID='1_uou6JDGV-Tm80oALMrduuj9ZIVWM1r9ppuQsYq7_qo';
const AR_GID='1407414424';
const Num=v=>(v||0).toLocaleString('id-ID');
const Rp=v=>v?'Rp'+Math.round(v).toLocaleString('id-ID'):'Rp0';
const N=v=>parseFloat(String(v||'').replace(/[^0-9.-]/g,''))||0;
const MO_SHORT=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MO_MAP={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
// Tanggal di sheet berformat "5-Jun-2026". Ditampilkan jadi "5 Jun 2026";
// kalau formatnya tak dikenali, teks aslinya dipakai apa adanya.
function fmtTgl(raw){
  const s=String(raw||'').trim();
  const m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(!m) return s||'-';
  const mi=MO_MAP[m[2].toLowerCase()];
  if(mi===undefined) return s;
  return parseInt(m[1],10)+' '+MO_SHORT[mi]+' '+m[3];
}
function tglSort(raw){
  const s=String(raw||'').trim();
  const m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(!m) return 0;
  const mi=MO_MAP[m[2].toLowerCase()];
  if(mi===undefined) return 0;
  return new Date(parseInt(m[3],10),mi,parseInt(m[1],10)).getTime();
}
const agingDays=a=>{const m=String(a||'').match(/\d+/);return m?parseInt(m[0],10):0;};
// Klasifikasi "diatas 60 hari" mengikuti kolom Kategori (R) — persis seperti
// calc.js di dashboard (i.kategori.includes('60')), bukan hasil parsing angka
// kolom Aging, supaya angkanya selalu sama dengan Section 09 Piutang.
const isDiatas60=i=>String(i.kategori||'').includes('60');
function csv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f.trim());f='';}else if(c==='\n'||c==='\r'){if(f||row.length){row.push(f.trim());rows.push(row);}row=[];f='';if(c==='\r'&&t[i+1]==='\n')i++;}else f+=c;}if(f||row.length){row.push(f.trim());rows.push(row);}return rows;}

const params=new URLSearchParams(window.location.search);
const filterCompany=(params.get('company')||'').toUpperCase(); // '', 'MKI', atau 'CFN'
const filterQ=(params.get('q')||'').toUpperCase();

async function load(){
  document.getElementById('status').textContent='Mengambil data…';
  const r=await fetch('https://docs.google.com/spreadsheets/d/'+SID+'/export?format=csv&gid='+AR_GID+'&_='+Date.now());
  if(!r.ok) throw new Error('Gagal mengambil sheet AR 2026');
  const rows=csv(await r.text());
  const T=new Date();

  // AR 2026 (header baris 1), kolom posisi absolut L-S:
  // L=11 Tanggal | M=12 No Faktur | N=13 Customer | O=14 Nilai Faktur
  // P=15 Sisa Saldo | Q=16 Aging | R=17 Kategori | S=18 Company
  let items=rows.slice(1).map(r0=>({
    tanggal:r0[11]||'', noFaktur:(r0[12]||'').trim(), customer:(r0[13]||'').trim().toUpperCase(),
    nilaiFaktur:N(r0[14]), sisaSaldo:N(r0[15]), aging:(r0[16]||'').trim(),
    kategori:(r0[17]||'').trim(), company:(r0[18]||'').trim().toUpperCase(),
  })).filter(i=>i.noFaktur);

  if(filterCompany) items=items.filter(i=>i.company===filterCompany);
  if(filterQ) items=items.filter(i=>i.customer.includes(filterQ)||i.noFaktur.toUpperCase().includes(filterQ));

  // Yang dikirim adalah faktur yang MASIH punya sisa saldo (belum lunas) —
  // itulah yang perlu ditagih. Faktur lunas tetap ikut menghitung Nilai Faktur.
  const belumLunas=items.filter(i=>i.sisaSaldo>0)
    .sort((a,b)=>agingDays(b.aging)-agingDays(a.aging) || tglSort(a.tanggal)-tglSort(b.tanggal));

  return {T,items,belumLunas};
}

function fullLinkUrl(){
  const p=new URLSearchParams();
  if(filterCompany) p.set('company',filterCompany);
  if(filterQ) p.set('q',filterQ);
  p.set('_',Date.now());
  return new URL('piutang-full.html?'+p.toString(), window.location.href).toString();
}

function stats(d){
  const totalNilai=d.items.reduce((s,i)=>s+i.nilaiFaktur,0);
  const totalSisa=d.belumLunas.reduce((s,i)=>s+i.sisaSaldo,0);
  const invUnik=new Set(d.belumLunas.map(i=>i.noFaktur)).size;
  const custUnik=new Set(d.belumLunas.map(i=>i.customer)).size;
  const di60=d.belumLunas.filter(isDiatas60);
  const nilai60=di60.reduce((s,i)=>s+i.sisaSaldo,0);
  return {totalNilai,totalSisa,invUnik,custUnik,cnt60:di60.length,nilai60};
}

function draw(d){
  const THUMB_LIMIT=10;
  const isThumb=d.belumLunas.length>THUMB_LIMIT;
  const shown=isThumb ? d.belumLunas.slice(0,8) : d.belumLunas;
  const st=stats(d);

  const W=1080,L=40,rowH=30,headH=30,topH=150,footH=56;
  let cols;
  if(filterCompany){
    cols=[
      {label:'TANGGAL FAKTUR',w:130,get:i=>fmtTgl(i.tanggal)},
      {label:'NO FAKTUR',w:220,get:i=>i.noFaktur},
      {label:'NAMA CUSTOMER',w:250,get:i=>i.customer},
      {label:'NILAI FAKTUR',w:150,align:'right',get:i=>Rp(i.nilaiFaktur)},
      {label:'SISA SALDO',w:150,align:'right',get:i=>Rp(i.sisaSaldo)},
      {label:'AGING',w:100,align:'right',get:i=>i.aging||'-'},
    ];
  } else {
    cols=[
      {label:'TANGGAL FAKTUR',w:120,get:i=>fmtTgl(i.tanggal)},
      {label:'NO FAKTUR',w:200,get:i=>i.noFaktur},
      {label:'NAMA CUSTOMER',w:210,get:i=>i.customer},
      {label:'NILAI FAKTUR',w:140,align:'right',get:i=>Rp(i.nilaiFaktur)},
      {label:'SISA SALDO',w:140,align:'right',get:i=>Rp(i.sisaSaldo)},
      {label:'AGING',w:90,align:'right',get:i=>i.aging||'-'},
      {label:'COMPANY',w:100,align:'right',get:i=>i.company||'-'},
    ];
  }
  const extraRow=isThumb?1:0;
  const H=topH+headH+Math.max(shown.length+extraRow,1)*rowH+footH+16;
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');
  cv.height=H;
  const MO=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const DY=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  cx.fillStyle='#f8f5f0';cx.fillRect(0,0,W,H);
  const hg=cx.createLinearGradient(0,0,W,0);hg.addColorStop(0,'#c17a5a');hg.addColorStop(1,'#a85d3f');
  cx.fillStyle=hg;cx.fillRect(0,0,W,106);
  cx.fillStyle='rgba(255,255,255,.65)';cx.font='600 20px system-ui';cx.fillText('MKI — CABANG MAKASSAR',44,34);
  const titleSuffix=filterCompany?' — '+filterCompany:'';
  cx.fillStyle='#fff';cx.font='bold 26px system-ui';cx.fillText('Laporan Piutang (AR) 2026'+titleSuffix,44,72);
  cx.fillStyle='rgba(255,255,255,.75)';cx.font='400 16px system-ui';cx.textAlign='right';
  cx.fillText(DY[d.T.getDay()]+', '+d.T.getDate()+' '+MO[d.T.getMonth()]+' '+d.T.getFullYear(),W-44,62);cx.textAlign='left';

  cx.fillStyle='#5a4a3a';cx.font='bold 14px system-ui';
  let note1=Num(st.invUnik)+' invoice belum lunas dari '+Num(st.custUnik)+' customer — sisa saldo '+Rp(st.totalSisa);
  if(filterQ) note1+=' — pencarian: "'+filterQ+'"';
  cx.fillText(note1,44,128);
  cx.fillStyle='#a85d3f';cx.font='600 12.5px system-ui';
  let note2='Aging diatas 60 hari: '+Num(st.cnt60)+' faktur senilai '+Rp(st.nilai60);
  if(isThumb) note2+='  •  pratinjau 8 aging tertinggi, lengkap di link';
  cx.fillText(note2,44,146);

  let y=topH;
  cx.fillStyle='#efe4d6';cx.fillRect(L,y,W-2*L,headH);
  cx.font='bold 11px system-ui';cx.fillStyle='#7a6248';
  let x=L;
  cols.forEach(c=>{
    cx.textAlign=c.align||'left';
    cx.fillText(c.label, c.align==='right'? x+c.w-8 : x+8, y+19);
    x+=c.w;
  });
  cx.textAlign='left';
  y+=headH;

  if(shown.length===0){
    cx.fillStyle='#9a8a72';cx.font='italic 13px system-ui';
    cx.fillText('Tidak ada faktur belum lunas yang cocok dengan filter.',L+8,y+20);
    y+=rowH;
  } else {
    shown.forEach((i,idx)=>{
      if(idx%2===1){cx.fillStyle='#efe9df';cx.fillRect(L,y,W-2*L,rowH);}
      const tua=isDiatas60(i);
      x=L;
      cols.forEach(c=>{
        let txt=String(c.get(i));
        const maxW=c.w-14;
        cx.fillStyle=(tua&&c.label==='AGING')?'#b04a3a':'#2a2520';
        cx.font=(tua&&c.label==='AGING')?'600 11.5px system-ui':'400 11.5px system-ui';
        if(cx.measureText(txt).width>maxW){
          while(txt.length>1 && cx.measureText(txt+'…').width>maxW) txt=txt.slice(0,-1);
          txt+='…';
        }
        cx.textAlign=c.align||'left';
        cx.fillText(txt, c.align==='right'? x+c.w-8 : x+8, y+19);
        x+=c.w;
      });
      cx.textAlign='left';
      y+=rowH;
    });
  }

  if(isThumb){
    const remaining=d.belumLunas.length-shown.length;
    cx.fillStyle='#f3e6de';cx.fillRect(L,y,W-2*L,rowH);
    cx.fillStyle='#a85d3f';cx.font='italic 600 12px system-ui';
    cx.fillText('+ '+Num(remaining)+' faktur lainnya — lihat data lengkap di link pada pesan ini ↓',L+8,y+19);
    y+=rowH;
  }

  cx.fillStyle='#efe8df';cx.fillRect(0,H-footH,W,footH);
  cx.fillStyle='#a08060';cx.font='400 13px system-ui';
  cx.fillText('mkimakassar84-dev.github.io/Kinerja-Cabang-Makassar  •  '+new Date().toLocaleString('id-ID'),44,H-20);

  return {isThumb};
}

function cap(d,isThumb){
  const DY=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const MO=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const st=stats(d);
  const titleSuffix=filterCompany?' '+filterCompany:'';
  let txt='💰 *Laporan Piutang (AR)'+titleSuffix+' '+DY[d.T.getDay()]+', '+d.T.getDate()+' '+MO[d.T.getMonth()]+' '+d.T.getFullYear()+'*'
    +'\n'+Num(st.invUnik)+' invoice belum lunas dari '+Num(st.custUnik)+' customer'
    +'\n💵 Sisa saldo piutang: '+Rp(st.totalSisa)
    +'\n🔴 Aging diatas 60 hari: '+Num(st.cnt60)+' faktur ('+Rp(st.nilai60)+')';
  if(filterQ) txt+='\n🔍 Pencarian: "'+filterQ+'"';
  if(isThumb){
    txt+='\n\n📄 Data lengkap (semua '+Num(d.belumLunas.length)+' faktur, dikelompokkan per company):\n'+fullLinkUrl();
  }
  return txt;
}

async function main(){
  try{
    const data=await load();
    document.getElementById('status').textContent='Membuat gambar…';
    const {isThumb}=draw(data);
    document.getElementById('spinner').style.display='none';
    document.getElementById('status').style.display='none';
    const cv=document.getElementById('cv');cv.style.display='block';document.getElementById('btnGroup').style.display='flex';
    if(isThumb){
      const linkEl=document.getElementById('linkFull');
      linkEl.href=fullLinkUrl();
      linkEl.style.display='block';
    }
    const ts=[data.T.getFullYear(),String(data.T.getMonth()+1).padStart(2,'0'),String(data.T.getDate()).padStart(2,'0')].join('-');
    const c=cap(data,isThumb),fn='Piutang-MKI-'+(filterCompany||'All')+'-'+ts+(isThumb?'-preview':'')+'.png';
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const file=new File([blob],fn,{type:'image/png'});
    const canShareFile=!!(navigator.canShare&&navigator.canShare({files:[file]}));
    function fallbackShare(){
      const a=document.createElement('a');a.download=fn;a.href=cv.toDataURL('image/png');a.click();
      setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(c),'_blank'),800);
      const n=document.getElementById('note');n.textContent='Gambar disimpan. Kirim dari galeri ke WhatsApp.';n.style.display='block';
    }
    document.getElementById('btnWA').addEventListener('click',()=>{
      if(navigator.share&&canShareFile){
        navigator.share({files:[file],title:'Laporan Piutang '+ts,text:c}).catch(e=>{
          if(e&&e.name==='AbortError')return;
          fallbackShare();
        });
        return;
      }
      fallbackShare();
    });
    document.getElementById('btnSave').addEventListener('click',()=>{const a=document.createElement('a');a.download=fn;a.href=cv.toDataURL('image/png');a.click();});
  }catch(err){
    document.getElementById('spinner').style.display='none';document.getElementById('status').style.display='none';
    const e=document.getElementById('errMsg');e.style.display='block';e.textContent='Gagal: '+err.message;console.error(err);
  }
}
main();
</script>
</body>
</html>
